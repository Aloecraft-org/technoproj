name: ci

on:
  # Push on the default branch only: a pull request's commits are checked
  # by its `pull_request` run, and a branch push trigger ran them twice.
  # `technoproj ci check` below holds this, here and in every consumer.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on a pull request cancels the run it replaces; runs on
# `main` are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # requires-python is >=3.9, but ubuntu-latest (26.04) has no 3.9
          # build, so the floor runs on the newest image that still has one.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: pytest -q tests/
      # The engine is useless if the fragment it ships cannot be placed.
      - name: sync and check round-trip
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          technoproj sync
          technoproj check
      # The same for the operating layout: a fresh repository gets every
      # file, and check names the scaffold the owner still has to fill in.
      - name: lockstep init and check round-trip
        run: |
          mkdir -p /tmp/lockstep && cd /tmp/lockstep
          technoproj lockstep init --owner aloecraft
          if technoproj lockstep check; then exit 1; fi
          technoproj lockstep check 2>&1 | grep -q 'goal.md is not filled in yet'
      # Dogfood: this repository carries its own .technoproj and CHANGELOG,
      # so it can run every check it asks consumers to run.
      - name: our own declaration holds
        run: |
          technoproj check
          technoproj-changelog validate
          technoproj-changelog consistency
          technoproj-changelog check
      # The release contract checks itself. technoproj's own release.yml is
      # the reference caller every other repository copies, so a change that
      # breaks the contract must fail here rather than in the first
      # repository that adopts it.
      - name: the release workflow conforms
        run: technoproj release check-workflow
      - name: every workflow runs once per pull request commit
        run: technoproj ci check
      - name: every release gate passes
        run: technoproj release preflight
      # The shared workflows are the deliverable; a syntax error in one is
      # only discovered by a consuming repo's release otherwise.
      - name: the reusable workflows parse
        run: |
          python -c "
          import sys, yaml
          for f in ('release-preflight', 'release-publish', 'release'):
              p = '.github/workflows/%s.yml' % f
              d = yaml.safe_load(open(p))
              assert d.get('jobs'), p
              print('ok', p)
          "
      - name: the status board builds and stays self-contained
        run: ./status/build.sh --out /tmp/status-out
