name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: pytest -q tests/
      # The engine is useless if the fragment it ships cannot be placed.
      - name: sync and check round-trip
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          technoproj sync
          technoproj check
      # Dogfood: this repository carries its own .technoproj and CHANGELOG,
      # so it can run every check it asks consumers to run.
      - name: our own declaration holds
        run: |
          technoproj check
          technoproj-changelog validate
          technoproj-changelog consistency
          technoproj-changelog check
      # The release contract checks itself. technoproj's own release.yml is
      # the reference caller every other repository copies, so a change that
      # breaks the contract must fail here rather than in the first
      # repository that adopts it.
      - name: the release workflow conforms
        run: technoproj release check-workflow
      - name: every release gate passes
        run: technoproj release preflight
      # The shared workflows are the deliverable; a syntax error in one is
      # only discovered by a consuming repo's release otherwise.
      - name: the reusable workflows parse
        run: |
          python -c "
          import sys, yaml
          for f in ('release-preflight', 'release-publish', 'release'):
              p = '.github/workflows/%s.yml' % f
              d = yaml.safe_load(open(p))
              assert d.get('jobs'), p
              print('ok', p)
          "
      - name: the status board builds and stays self-contained
        run: ./status/build.sh --out /tmp/status-out
