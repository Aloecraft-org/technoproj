<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status</title>
<!-- No external requests. Not a preference: a status board is what you open
     when something is down, and a page that needs a CDN to render is a page
     that fails in exactly that moment. System fonts, inline everything. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="head">
    <div class="head-main">
      <h1 id="title">Status</h1>
      <span class="profile" id="profile" hidden></span>
    </div>
    <!-- The age of the DATA, not of this render. The distinction is the
         whole reason this line exists. -->
    <div class="freshness" id="freshness">
      <span class="dot" id="fresh-dot"></span>
      <span id="fresh-text">loading…</span>
    </div>
  </header>

  <section class="sources" id="sources" aria-label="data sources"></section>

  <main>
    <table class="grid" id="grid">
      <thead>
        <tr>
          <th scope="col">project</th>
          <th scope="col">release</th>
          <th scope="col">build</th>
          <th scope="col" class="act-col">last activity</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="4" class="empty">loading…</td></tr>
      </tbody>
    </table>
  </main>

  <footer class="foot">
    <p>
      A filled pill is data this page trusts. A <span class="pill hollow ok">hollow
      one</span> is the same value gone stale — the number may still be right,
      but nothing has confirmed it recently.
    </p>
    <p id="foot-meta" class="meta"></p>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
