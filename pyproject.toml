[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "technoproj"
version = "0.3.0"
description = "Shared release tooling for Aloecraft projects: one changelog engine and one version.mk, driven by each repository's .technoproj declaration."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.1"]

[[project.authors]]
name = "Michael Godfrey"
email = "michael@aloecraft.org"

[project.scripts]
# The changelog engine, argument-for-argument compatible with the
# script/changelog.py it replaces -- migrating a repository is a change of
# command name, not of usage.
technoproj-changelog = "technoproj.changelog:main"
# The status board's collector, so a host gets it by installing the package
# rather than by a second copy rsynced into the fleet.
technoproj-status-collect = "technoproj.status:main"
# Everything else: placing version.mk and the lockstep layout into a
# consuming repo, and checking neither has drifted.
technoproj = "technoproj.cli:main"

[tool.setuptools.packages.find]
include = ["technoproj*"]

[tool.setuptools.package-data]
technoproj = [
    "data/*.mk",
    "profiles/*.json",
    "data/lockstep/shared/*.md",
    "data/lockstep/scaffold/claude/*.md",
    "data/lockstep/scaffold/doc/lockstep/*",
    "data/lockstep/scaffold/github/CODEOWNERS",
    "data/lockstep/scaffold/github/rulesets/*.json",
]
